<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greenpoint Ambient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #f7f3ec;
    --ink-soft: rgba(247, 243, 236, 0.82);
    --ink-faint: rgba(247, 243, 236, 0.55);
    --panel: rgba(10, 12, 18, 0.58);
    --line: rgba(247, 243, 236, 0.16);
    --accent: #ffcf8a;
    --good: #5fd38d; --warn: #ffb347; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #07080c; color: var(--ink);
    font-family: Inter, system-ui, sans-serif; cursor: none; }
  .shadow { text-shadow: 0 2px 18px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.5); }

  /* ---------- Photo / art layer ---------- */
  #gallery { position: fixed; inset: 0; z-index: 0; background: #07080c; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 3s ease; overflow: hidden; }
  .slide.on { opacity: 1; }
  .slide .photo { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .slide.on .photo.kb { animation: kenburns var(--kb-dur, 60s) ease-out forwards; }
  @keyframes kenburns { from { transform: scale(1.0) translate(0, 0); } to { transform: scale(1.09) translate(var(--kx, -1%), var(--ky, -1%)); } }
  /* Paintings: shown whole, hung on a blurred, darkened copy of themselves */
  /* The "wall" is a tiny thumbnail stretched up (soft for free) under a dark veil: no GPU blur, which crashed the Fire Stick's driver */
  .slide .wall { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .slide .wall::after { content: ""; position: absolute; inset: 0; background: rgba(8, 8, 12, .68); }
  .slide .canvas { position: absolute; inset: 7vh 6vw 9vh; background-size: contain; background-position: center; background-repeat: no-repeat; }
  #scrimTop { position: fixed; inset: 0 0 auto 0; height: 45vh; z-index: 1; background: linear-gradient(rgba(0,0,0,.72), rgba(0,0,0,.35) 50%, rgba(0,0,0,0)); transition: opacity 3s; }
  #scrimBot { position: fixed; inset: auto 0 0 0; height: 55vh; z-index: 1; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.72)); transition: opacity 3s; }

  /* ---------- Layout ---------- */
  #stage { position: fixed; inset: 0; z-index: 2; padding: 4.5vh 4vw 4vh; display: grid; grid-template-rows: auto 1fr auto auto; transition: opacity 3s; }
  header { display: flex; justify-content: space-between; align-items: flex-start; }
  #time { font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: 8.4vw; line-height: .9; letter-spacing: -.02em; }
  #time .ampm { font-size: 2vw; font-family: Inter, sans-serif; letter-spacing: .1em; color: var(--ink-soft); margin-left: .6vw; }
  #date { margin-top: 1.4vh; font-size: 1.75vw; color: var(--ink-soft); font-weight: 400; }
  #place { margin-top: .6vh; font-size: .95vw; letter-spacing: .3em; text-transform: uppercase; color: var(--ink-faint); }

  #weather { text-align: right; }
  #now { display: flex; align-items: center; justify-content: flex-end; gap: 1vw; }
  #now .icon { font-size: 3.8vw; line-height: 1; }
  #now .temp { font-family: Fraunces, serif; font-weight: 300; font-size: 5.2vw; line-height: 1; }
  #nowDesc { font-size: 1.3vw; color: var(--ink-soft); margin-top: .6vh; }
  #forecast { display: flex; gap: 1.5vw; justify-content: flex-end; margin-top: 2vh; transition: opacity 2s; }
  .day { text-align: center; min-width: 4vw; }
  .day .n { font-size: .95vw; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-faint); }
  .day .i { font-size: 1.9vw; margin: .4vh 0; }
  .day .t { font-size: 1.15vw; } .day .t span { color: var(--ink-faint); }
  #alert { display: none; margin-top: 1.6vh; margin-left: auto; max-width: 32vw; padding: .9vh 1vw; border-radius: .6vw;
    background: rgba(160, 30, 30, .78); font-size: 1.05vw; font-weight: 600; text-align: left; }

  /* ---------- Rotating card (several layouts) ---------- */
  #card { max-width: 58vw; padding: 3vh 2.2vw 2.6vh; border-radius: 1.2vw; background: var(--panel);
    border: 1px solid var(--line); transition: opacity 1.2s ease, transform 1.2s ease; align-self: end; text-shadow: none; }
  #card.out { opacity: 0; transform: translateY(2vh); }
  .tag { display: inline-flex; align-items: center; gap: .6vw; font-size: .95vw; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .tag::before { content: ""; width: .6vw; height: .6vw; border-radius: 50%; background: currentColor; }
  #card.mta .tag { color: var(--warn); } #card.editor .tag { color: #9fd8ff; } #card.holiday .tag { color: #ff8f8f; } #card.free .tag { color: var(--good); } #card.rm .tag { color: #c9b8ff; }
  .title { font-family: Fraunces, serif; font-weight: 500; font-size: 3.1vw; line-height: 1.12; margin: 1.2vh 0 1vh; }
  .body { font-size: 1.5vw; line-height: 1.45; color: var(--ink-soft); font-weight: 300; }
  .meta { margin-top: 1.4vh; font-size: 1.15vw; color: var(--ink-faint); }
  .row { display: flex; gap: 2vw; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  #progress { margin-top: 2vh; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--accent); animation: fill linear forwards; }
  @keyframes fill { from { width: 0; } to { width: 100%; } }
  /* QR tile: black on white so phones read it from across the room */
  .qr { flex: none; text-align: center; }
  .qr .code { background: #fff; padding: .55vw; border-radius: .6vw; width: 10.5vw; height: 10.5vw; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qr .cap { margin-top: .9vh; font-size: .85vw; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-faint); }
  /* Poster: date block + headline */
  .date { flex: none; text-align: center; padding-right: 2vw; border-right: 1px solid var(--line); min-width: 8vw; }
  .date .dow { font-size: .95vw; font-weight: 700; letter-spacing: .25em; text-transform: uppercase; color: var(--accent); }
  .date .num { font-family: Fraunces, serif; font-weight: 300; font-size: 6vw; line-height: 1; margin: .4vh 0; }
  .date .when { font-size: 1.05vw; color: var(--ink-soft); }
  .poster .title { font-size: 3.4vw; }
  .poster .title.long, .row .title.long { font-size: 2.5vw; }
  /* List: three things */
  .list ol { list-style: none; margin-top: 1.8vh; }
  .list li { display: grid; grid-template-columns: 9.5vw 1fr; gap: 1.4vw; padding: 1.3vh 0; border-top: 1px solid var(--line); align-items: baseline; }
  .list li:first-child { border-top: 0; }
  .list .lw { font-size: 1.05vw; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .list .lt { font-family: Fraunces, serif; font-size: 1.85vw; line-height: 1.2; }
  .list .lp { display: block; font-family: Inter, sans-serif; font-size: 1.05vw; color: var(--ink-faint); margin-top: .3vh; }
  /* Big number */
  .big .num { font-family: Fraunces, serif; font-weight: 300; font-size: 9vw; line-height: .9; letter-spacing: -.03em; }
  .big .title { margin-top: 0; }
  /* Fun fact: editorial pull-quote */
  .fact { display: flex; gap: 1.4vw; align-items: flex-start; max-width: 50vw; }
  .fact .mark { font-family: Fraunces, serif; font-size: 9vw; line-height: .75; color: var(--accent); opacity: .9; margin-top: .6vh; }
  .fact .cat { color: var(--ink-faint); font-weight: 600; }
  .fact .ftext { font-family: Fraunces, serif; font-weight: 300; font-size: 2.45vw; line-height: 1.28; margin-top: 1.4vh; }
  /* Morning briefing */
  .brief .hello { font-family: Fraunces, serif; font-weight: 300; font-size: 3.6vw; line-height: 1.05; margin: 1vh 0 2.2vh; }
  .brief .items { display: grid; grid-template-columns: 1fr 1fr; gap: 2.2vh 3vw; }
  .brief .it { display: flex; gap: 1vw; align-items: flex-start; }
  .brief .it svg { width: 2.2vw; height: 2.2vw; flex: none; margin-top: .2vh; }
  .brief .k { font-size: .85vw; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-faint); }
  .brief .v { font-size: 1.45vw; line-height: 1.3; margin-top: .3vh; }

  /* Line icons (stroke follows text color) */
  .ico { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #now .icon svg { width: 4.2vw; height: 4.2vw; display: block; }
  .day .i svg { width: 2.2vw; height: 2.2vw; display: block; margin: 0 auto; }
  .sunc { color: #ffd27a; } .moonc { color: #dfe6ff; }

  /* ---------- Bottom strip: transit + credit ---------- */
  #strip { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2.6vh; gap: 2vw; transition: opacity 2s; }
  #transit { display: flex; gap: 1.6vw; align-items: center; flex-wrap: wrap; }
  .line { display: flex; align-items: center; gap: .55vw; font-size: 1.1vw; color: var(--ink-soft); }
  .bullet { display: inline-flex; align-items: center; justify-content: center; width: 1.9vw; height: 1.9vw; border-radius: 50%;
    font-weight: 700; font-size: 1.15vw; color: #fff; text-shadow: none; flex: none; }
  .bullet.inl { width: 1.5em; height: 1.5em; font-size: .78em; vertical-align: .12em; margin: 0 .1em; }
  .dot { width: .6vw; height: .6vw; border-radius: 50%; display: inline-block; }
  /* Live next-train countdown */
  #trains { display: flex; align-items: center; gap: 1.4vw; margin-bottom: 1.4vh; font-size: 1.25vw; transition: opacity 2s; }
  #trains:empty { display: none; }
  #trains .stn { font-weight: 600; letter-spacing: .02em; }
  #trains .dir { color: var(--ink-faint); font-size: .95vw; letter-spacing: .08em; text-transform: uppercase; margin-right: .4vw; }
  #trains .mins { font-family: Fraunces, serif; font-size: 1.7vw; font-weight: 500; }
  #trains .mins small { font-family: Inter, sans-serif; font-size: .9vw; color: var(--ink-soft); margin-left: .15vw; }
  #trains .sep { width: 1px; height: 2.2vh; background: var(--line); }
  #rmChip { font-size: 1.05vw; color: var(--ink-soft); display: none; }
  #credit { text-align: right; font-size: .95vw; color: var(--ink-faint); max-width: 48vw; line-height: 1.4; transition: all 2s; }
  #credit b { color: var(--ink-soft); font-weight: 600; font-style: italic; font-family: Fraunces, serif; font-size: 1.15vw; }
  #credit .why { display: block; margin-top: .5vh; color: var(--accent); font-size: .85vw; letter-spacing: .16em; text-transform: uppercase; }
  /* Museum wall label for paintings */
  #placardWrap { position: fixed; right: 4vw; bottom: 4vh; z-index: 3; }
  .placard { text-align: left; background: #f3eee4; color: #1d1b18; text-shadow: none; padding: 2vh 1.5vw 1.9vh; border-radius: .25vw;
    width: 25vw; box-shadow: 0 1.5vh 4vh rgba(0,0,0,.45); opacity: 0; transform: translateY(1vh); transition: opacity 1.6s ease 2.5s, transform 1.6s ease 2.5s; }
  .placard.in { opacity: 1; transform: none; }
  .placard .pa { font-size: .85vw; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #6b6358; }
  .placard .pt { font-family: Fraunces, serif; font-style: italic; font-size: 1.6vw; line-height: 1.15; margin: .6vh 0 .2vh; }
  .placard .py { font-size: .95vw; color: #6b6358; }
  .placard .ps { font-size: 1.02vw; line-height: 1.45; margin-top: 1.2vh; color: #2c2925; }
  .placard .pm { font-size: .82vw; color: #8a8276; margin-top: 1.2vh; }
  .placard .see { margin-top: 1vh; font-size: .9vw; font-weight: 600; color: #8a5a12; }
  .placard .why { margin-top: 1vh; font-size: .78vw; letter-spacing: .16em; text-transform: uppercase; color: #8a5a12; }

  /* ---------- Ambient (gallery-only) mode ---------- */
  body.ambient #card { opacity: 0; transform: translateY(2vh); }
  body.ambient #forecast, body.ambient #transit, body.ambient #rmChip, body.ambient #nowDesc { opacity: 0; }
  body.ambient #scrimBot { opacity: .5; }
  body.ambient #credit { font-size: 1.15vw; }
  body.ambient #credit b { font-size: 1.6vw; }

  /* ---------- Late night: dim everything ---------- */
  /* Matchday: Madrid white and gold */
  body.matchday { --accent: #febe10; }
  body.matchday #card { background: rgba(250, 248, 242, .9); color: #14110c; border-color: #febe10; }
  body.matchday #card .body, body.matchday #card .meta, body.matchday #card .lp, body.matchday #card .k { color: #4a4438; }
  body.matchday #card .tag, body.matchday #card .lw { color: #b8860b; }
  body.matchday #card .qr .cap { color: #4a4438; }
  body.matchday #progress { background: rgba(0,0,0,.1); }
  body.matchday #rmChip { color: #febe10; font-weight: 600; }

  /* Late night: a dim painting and the time, nothing else */
  body.night #gallery { filter: brightness(.42); transition: filter 10s; }
  body.night #card, body.night #forecast, body.night #nowDesc, body.night #transit, body.night #rmChip, body.night #credit { opacity: 0; transition: opacity 3s; }
  body.night #stage { opacity: .7; }
  body.night #scrimBot { opacity: .3; }
  body.night #placardWrap { opacity: .55; }
</style>
</head>
<body>
  <div id="gallery"><div class="slide" id="s0"></div><div class="slide" id="s1"></div></div>
  <canvas id="fx" style="position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%"></canvas>
  <div id="scrimTop"></div><div id="scrimBot"></div>

  <main id="stage" class="shadow">
    <header>
      <div>
        <div id="time">--:--</div>
        <div id="date"></div>
        <div id="place"></div>
      </div>
      <div id="weather">
        <div id="now"><span class="icon"></span><span class="temp">--°</span></div>
        <div id="nowDesc">Loading weather…</div>
        <div id="forecast"></div>
        <div id="alert"></div>
      </div>
    </header>
    <div></div>
    <section id="card" class="out">
      <div id="cardBody"></div>
      <div id="progress"><div id="bar"></div></div>
    </section>
    <div id="strip">
      <div>
        <div id="trains"></div>
        <div id="transit"></div>
        <div id="rmChip"></div>
      </div>
      <div id="credit"></div>
    </div>
  </main>
  <div id="placardWrap"></div>

<script src="gallery.js"></script>
<script src="vendor/qrcode.min.js"></script>
<script src="gtfsrt.js"></script>
<script>
/* =====================================================================
   SETTINGS. You can also override location from the URL, for example:
   index.html?lat=40.7304&lon=-73.9515&place=Greenpoint%20%C2%B7%20Brooklyn
   ===================================================================== */
var qs = {}; location.search.replace(/[?&]([^=]+)=([^&]*)/g, function (_, k, v) { qs[k] = decodeURIComponent(v); });
// Private settings (API key, Wi-Fi, name) come after "#": browsers never send that part to the server.
location.hash.replace(/[#&]([^=]+)=([^&]*)/g, function (_, k, v) { qs[k] = decodeURIComponent(v); });
var CFG = {
  lat: +qs.lat || 40.7304, lon: +qs.lon || -73.9515,       // Greenpoint, Brooklyn (set by hand, not detected)
  place: qs.place || "Greenpoint · Brooklyn",
  subwayLines: (qs.lines || "G,L,7").split(","),           // lines shown in the bottom strip
  alertLines: (qs.alertLines || "G,L").split(","),         // lines that get a full alert card
  cardSeconds: 24,            // each info card
  photoSeconds: 50,           // each background image
  ambientEvery: 5,            // after this many cards, a gallery-only break...
  ambientSeconds: 120,        // ...lasting this long
  nightStart: 0, nightEnd: 6, // late-night mode (paintings + clock only) between these hours
  eventRadiusKm: 4,           // "nearby" radius for NYC Parks events
  realMadridId: "133738",     // TheSportsDB team id
  name: (qs.name || "").slice(0, 30)   // passed in by the Fire Stick app, so it's never in the public code
};
document.getElementById("place").textContent = CFG.place;

/* ================== CURATED PICKS ==================
   months: 1-12 to limit by month; days: 0=Sun..6=Sat; until: "YYYY-MM-DD" hides it after that date. */
var PICKS = [
  { tag: "Greenpoint gem", title: "Transmitter Park at sunset", body: "Walk to the end of Greenpoint Ave and watch Midtown light up across the East River.", meta: "Greenpoint Ave & West St" },
  { tag: "Greenpoint gem", title: "Newtown Creek Nature Walk", body: "A strange, beautiful path beside the silver 'digester eggs.' One of the most cinematic spots in the neighborhood.", meta: "Paidge Ave & Provost St" },

  { tag: "Brooklyn", title: "Bushwick street art walk", body: "The blocks around Jefferson St and Troutman St have some of the biggest murals in the city.", meta: "Jefferson St L stop" },

  { tag: "This season", title: "Dyker Heights Christmas lights", body: "Whole blocks of over-the-top holiday displays. Best after dark from early December.", meta: "11th–13th Aves, 83rd–86th St", months: [12] },
  { tag: "This season", title: "Rockefeller Center tree", body: "Lit from late November into January. Go late at night to skip the crowds.", meta: "30 Rockefeller Plaza", months: [11, 12, 1] },

/* ================== FREE DAYS ==================
   Hours change; each card tells you to check or book ahead.
   day: 0=Sun..6=Sat. nth: only the nth such weekday of the month. months: limit by month. */
var FREE = [

    body: "Transmitter Park and the Kent Ave waterfront face it head on.", url: mapsUrl("Transmitter Park, Brooklyn"), qrCap: "Scan for directions" };
  if (rain >= 60) return { layout: "big", tag: "Today", num: rain + "%", title: "Chance of rain. Take an umbrella.", body: "Good day for a movie at Nitehawk or a long lunch on Franklin St." };
  if (hi >= 85) return { layout: "big", tag: "Today", num: hi + "°", title: "A hot one.", body: "Head to the waterfront for a breeze, or ride the ferry for some air." };
  if (hi <= 35) return { layout: "big", tag: "Today", num: hi + "°", title: "Is the high. Bundle up.", body: "Good day for a museum, a bakery run, or staying in." };
  if (rain < 20 && hi >= 55) return { layout: "big", tag: "Today", num: hi + "°", title: "And dry. Get outside.", body: "McCarren Park, the waterfront, or a ferry ride." };
  // Best day in the next few
  var best = -1, bi = 0;
  for (var i = 1; i < dd.time.length; i++) { var sc = dd.temperature_2m_max[i] - (dd.precipitation_probability_max[i] || 0) * .4; if (sc > best) { best = sc; bi = i; } }
  if (bi) { var d = new Date(dd.time[bi] + "T12:00:00");
    return { layout: "big", tag: "Looking ahead", num: Math.round(dd.temperature_2m_max[bi]) + "°", title: d.toLocaleDateString("en-US", { weekday: "long" }) + " looks like the best day this week.",
      body: (dd.precipitation_probability_max[bi] || 0) < 25 ? "Dry, too. Plan something outside." : "Some chance of rain, but the warmest of the bunch." }; }
  return null;
}
function wearAdvice(hi, lo) {
  var t = (hi + lo) / 2;
  return t <= 30 ? "Heavy coat, hat and gloves" : t <= 42 ? "Warm coat and a scarf" : t <= 55 ? "A jacket or a warm layer" : t <= 68 ? "Light layers" : t <= 78 ? "T-shirt weather" : "Shorts and sunscreen";
}

/* ================== MORNING BRIEFING + LISTS ================== */
function briefing() {
  if (!wx) return null;
  var now = nyNow(), h = now.getHours(), dd = wx.daily, hi = dd.temperature_2m_max[0], lo = dd.temperature_2m_min[0], rain = dd.precipitation_probability_max[0] || 0;
  var hello = (h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening") + (CFG.name ? ", " + CFG.name : "") + ".";
  var mine = mta.filter(affectsMe);
  var subway = mine.length ? mine[0].routes.filter(function (r) { return CFG.alertLines.indexOf(r) > -1; }).join(" and ") + " trains: " + mine[0].label.toLowerCase() : CFG.alertLines.join(" and ") + " running normally near home";
  var nn = nextTrainMins("N", 1)[0], ns = nextTrainMins("S", 1)[0];
  if (nn !== undefined || ns !== undefined) subway = "Next G: " + [ns !== undefined ? ns + " min to Church Av" : "", nn !== undefined ? nn + " min to Court Sq" : ""].filter(Boolean).join(", ") + (mine.length ? ". " + subway : "");
  var free = freeCards().filter(function (c) { return c.tag === "Free today"; })[0];
  var todayKey = isoDay(now).slice(0, 10), ev = events.filter(function (e) { return e.day === todayKey; })[0];
  if (h >= 17) {   // Evening edition: tonight and tomorrow
    var tomKey = isoDay(new Date(+now + 864e5)).slice(0, 10), tev = events.filter(function (e) { return e.day === tomKey; })[0];
    var thi = dd.temperature_2m_max[1], train = dd.precipitation_probability_max[1] || 0, tw = wmo(dd.weather_code[1]);
    var freeTom = freeCards().filter(function (c) { return c.tag === "Free tomorrow"; })[0];
    return { layout: "brief", label: "Evening briefing", hello: hello + " Down to " + Math.round(lo) + "° tonight.", items: [
      { i: tw[0], k: "Tomorrow", v: Math.round(thi) + "°, " + tw[1].toLowerCase() + (train >= 40 ? ", " + train + "% rain" : "") },
      { i: "shirt", k: "Tomorrow, wear", v: wearAdvice(thi, dd.temperature_2m_min[1]) },
      { i: "train", k: "Subway", v: subway },
      { i: "star", k: freeTom || tev ? "Tomorrow" : "Tonight", v: freeTom ? freeTom.title + " is free" : tev ? tev.title + (tev.timeText ? ", " + tev.timeText : "") : "Clear skies? Look for the moon over the Manhattan skyline from Transmitter Park." } ] };
  }
  var eh = editorFresh(editor) && editor.headline && stillOn(editor.headline) ? editor.headline : null;
  var highlight = eh ? eh.title + (eh.timeText ? ", " + eh.timeText : "") : free ? free.title + " is free today" : ev ? ev.title + (ev.timeText ? ", " + ev.timeText : "") : "Sunset at " + hm(new Date(dd.sunset[0])) + ". Catch it from the waterfront.";
  return { layout: "brief", hello: hello + " " + Math.round(hi) + "° today.", items: [
    { i: "shirt", k: "Wear", v: wearAdvice(hi, lo) },
    { i: "umbrella", k: "Umbrella", v: rain >= 40 ? "Yes, " + rain + "% chance of rain" : "Not needed (" + rain + "%)" },
    { i: "train", k: "Subway", v: subway },
    { i: "star", k: "Today", v: highlight } ] };
}
function listCard() {
  var now = nyNow(), d = now.getDay(), h = now.getHours(), todayKey = isoDay(now).slice(0, 10);
  var pool = editorEvents().concat(events, shows), title, tag;
  if (h >= 16 && h < 22) { pool = pool.filter(function (e) { return e.day === todayKey; }); tag = "Tonight"; title = "Still on today"; }
  else if (d >= 4 || d === 0) {
    var wk = []; for (var i = 0; i < 4; i++) { var x = new Date(+now + i * 864e5); if (x.getDay() === 5 || x.getDay() === 6 || x.getDay() === 0) wk.push(isoDay(x).slice(0, 10)); }
    pool = pool.filter(function (e) { return wk.indexOf(e.day) > -1; }); tag = "This weekend"; title = "Three ideas for the weekend";
  } else { tag = "Coming up"; title = "On the calendar this week"; }
  if (pool.length < 3) { pool = editorEvents().concat(events, shows); tag = "Coming up"; title = "On the calendar this week"; }
  // Best three, spread across boroughs (at most two from one borough), then shown in time order
  pool.sort(function (a, b) { return b.score - a.score; });
  var picked = [], per = {};
  pool.forEach(function (e) { var k = e.boro || "Brooklyn"; if (picked.length < 3 && (per[k] || 0) < 2) { picked.push(e); per[k] = (per[k] || 0) + 1; } });
  pool = picked.sort(function (a, b) { return a.when - b.when; });
  if (pool.length < 2) return null;
  var allToday = pool.slice(0, 3).every(function (e) { return e.day === todayKey; });
  if (allToday) { tag = h >= 16 ? "Tonight" : "Today"; title = "Three ideas for today"; }
  return { layout: "list", tag: tag, title: title, rows: pool.slice(0, 3).map(function (e) {
    var dt = new Date(e.day + "T12:00:00");
    if (allToday) return { w: e.timeText ? e.timeText.replace(/:00/g, "").replace(/–.*/, "") : "All day", t: e.title, p: e.place || "" };
    return { w: dayLabel(dt) === "Today" ? "Today" : dt.toLocaleDateString("en-US", { weekday: "short" }) + (e.timeText ? " " + e.timeText.replace(/:00/g, "").replace(/–.*/, "") : ""), t: e.title, p: e.place || "" };
  }) };
}

/* ================== FACTS: curated + "On this day in New York" ================== */
var otd = cache("otd") || { day: "", items: [] }, factBag = [];
var NYRE = /(New York City|Brooklyn|Manhattan|Queens|the Bronx|Staten Island|Harlem|Coney Island|Central Park|Broadway|Times Square|Statue of Liberty|Ellis Island|Yankee Stadium|Madison Square)/;
function loadOTD() {
  var n = nyNow(), key = (n.getMonth() + 1) + "/" + n.getDate();
  if (otd.day === key) return;
  var mm = ("0" + (n.getMonth() + 1)).slice(-2), dd = ("0" + n.getDate()).slice(-2);
  getJSON("https://en.wikipedia.org/api/rest_v1/feed/onthisday/all/" + mm + "/" + dd).then(function (d) {
    var items = [];
    (d.selected || []).concat(d.events || []).forEach(function (e) {
      if (e.text && NYRE.test(e.text) && e.text.length < 230 && !items.some(function (x) { return x.t === e.text; })) items.push({ y: e.year, t: e.text });
    });
    otd = { day: key, items: items.slice(0, 4) }; cache("otd", otd);
  }).catch(function () {});
}
function nextFact() {
  var n = nyNow(), key = (n.getMonth() + 1) + "/" + n.getDate();
  // Today's NYC history gets priority, once each
  if (otd.day === key) { var u = otd.items.filter(function (x) { return !x.used; })[0];
    if (u) { u.used = true; return { layout: "fact", kicker: "On this day in " + u.y, cat: "New York history", text: u.t }; } }
  if (!factBag.length) { var mo = n.getMonth() + 1;   // seasonal facts only in their months; AI editor facts join the pool
    factBag = shuffle(FACTS.concat((editor && editor.facts) || []).filter(function (f) { return !f.months || f.months.indexOf(mo) > -1; })); }
  var f = factBag.shift();
  return { layout: "fact", kicker: "Worth talking about", cat: f.c, text: f.t };
}

/* ================== AI EDITOR (data/editor.json, researched and written each morning by a scheduled Claude routine) ================== */
var editor = cache("editor") || null;
var CAT_TAG = { holiday: "Holiday pick", film: "Film & photo pick", art: "Art pick", music: "Music pick", food: "Food pick", city: "Editor's pick" };
function editorFresh(e) { return e && e.updated && (nyNow() - new Date(e.updated + "T12:00:00")) / 864e5 < 3; }
function loadEditor() {
  fetch("data/editor.json?t=" + Date.now()).then(function (r) { if (!r.ok) throw r.status; return r.json(); })
    .then(function (e) { if (editorFresh(e)) { editor = e; cache("editor", e); } else editor = null; }).catch(function () {});
}
function stillOn(p) { var today = isoDay(nyNow()).slice(0, 10); return !p.until || today <= p.until; }
function editorEvents() {   // editor picks shaped like events (poster when dated)
  if (!editorFresh(editor) || !editor.picks) return [];
  return editor.picks.filter(stillOn).map(function (p) {
    var d = p.day ? new Date(p.day + "T" + (p.time24 || "12:00") + ":00") : null;
    return { layout: p.day ? "poster" : "standard", cls: "editor", tag: (CAT_TAG[p.cat] || "Editor's pick") + (p.boro && p.boro !== "Brooklyn" ? " · " + p.boro : ""),
      title: p.title, body: p.body, meta: p.meta || "", place: p.place || "", day: p.day, timeText: p.timeText || "", when: d ? +d : +nyNow(),
      boro: p.boro || "Brooklyn", url: p.url, qrCap: p.url ? "Scan for details" : "", score: 200 };
  });
}
function editorHeadline() {
  var h = editor.headline;
  return { layout: h.day ? "poster" : "standard", cls: "editor", tag: "Today's pick", title: h.title, body: h.body, meta: h.meta || "", day: h.day, timeText: h.timeText || "",
    url: h.url, qrCap: h.url ? "Scan for details" : "" };
}

/* ================== HOLIDAY SEASON ================== */
// Countdowns. The AI editor can add or correct these in data/editor.json ("countdowns").
var COUNTDOWNS = [
  { date: "2026-12-02", title: "Rockefeller Center tree lighting", body: "Wednesday, 7 to 10 PM. Free and first come, first served on the streets around the plaza, or watch it live on NBC.", url: "https://www.rockefellercenter.com/holidays/rockefeller-center-christmas-tree/", qrCap: "Scan for details" },
  { md: "12-25", title: "Christmas", body: "Rockefeller tree, Saks light show on Fifth Ave, Dyker Heights after dark, and the Bryant Park market. Plan a lights night." },
  { md: "12-31", title: "New Year's Eve", body: "The ball drops at midnight in Times Square. For a calmer view, the fireworks over Prospect Park are a Brooklyn favorite." }
];
function holidaySeason() { var n = nyNow(), m = n.getMonth() + 1, d = n.getDate(); return (m === 11 && d >= 10) || m === 12 || (m === 1 && d <= 6); }
function countdownCard() {
  var now = nyNow(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), best = null;
  COUNTDOWNS.concat((editor && editor.countdowns) || []).forEach(function (c) {
    var ds = c.date || (now.getFullYear() + "-" + c.md), d = new Date(ds + "T00:00:00"), days = Math.round((d - today) / 864e5);
    if (days >= 0 && days <= 30 && (!best || days < best.days)) best = { c: c, days: days };
  });
  if (!best) return null;
  var c = best.c, days = best.days;
  return { layout: "big", cls: "holiday", tag: "Countdown", num: days === 0 ? "Today" : days + (days === 1 ? " day" : " days"),
    title: days === 0 ? c.title + " is today." : "until " + c.title + ".", body: c.body, url: c.url, qrCap: c.qrCap || "Scan for details" };
}

/* ================== GUEST WI-FI (network details passed privately by the TV app) ================== */
function wifiEsc(s) { return String(s).replace(/([\\;,:"])/g, "\\$1"); }
function guestHours() { var n = nyNow(), h = n.getHours(), d = n.getDay(); return (d === 0 || d === 6) ? h >= 10 && h < 23 : h >= 17 && h < 23; }
function wifiCard() {
  if (!qs.ws) return null;
  var payload = "WIFI:T:" + (qs.wt || "WPA") + ";S:" + wifiEsc(qs.ws) + ";P:" + wifiEsc(qs.wp || "") + ";;";
  return { layout: "wifi", ssid: qs.ws, payload: payload };
}

/* ================== CARD RENDERING ================== */
function qrBlock(c) {
  if (!c.url) return "";
  var svg = qrSVG(c.url); if (!svg) return "";
  return '<div class="qr"><div class="code">' + svg + '</div><div class="cap">' + esc(c.qrCap || "Scan for details") + "</div></div>";
}
function renderCard(c) {
  var L = c.layout || "standard", h = "";
  var tag = '<div class="tag">' + esc(c.tag || "") + "</div>";
  var title = c.titleHTML || esc(c.title || ""), body = c.bodyHTML || esc(c.body || "");
  var long = !c.titleHTML && (c.title || "").length > 36 ? " long" : "";
  if (L === "poster") {
    var d = new Date(c.day + "T12:00:00");
    h = '<div class="row poster"><div class="date"><div class="dow">' + esc(dayLabel(d) === "Today" ? "Today" : dayLabel(d) === "Tomorrow" ? "Tomorrow" : d.toLocaleDateString("en-US", { weekday: "short" })) +
      '</div><div class="num">' + d.getDate() + '</div><div class="when">' + esc(d.toLocaleDateString("en-US", { month: "short" }) + (c.timeText ? " · " + c.timeText : "")) + "</div></div>" +
      '<div class="grow">' + tag + '<div class="title' + long + '">' + title + '</div><div class="body">' + body + "</div></div>" + qrBlock(c) + "</div>";
  } else if (L === "list") {
    h = '<div class="list">' + tag + '<div class="title' + long + '">' + title + "</div><ol>" + c.rows.map(function (r) {
      return '<li><span class="lw">' + esc(r.w) + '</span><span class="lt">' + esc(r.t) + (r.p ? '<span class="lp">' + esc(r.p) + "</span>" : "") + "</span></li>"; }).join("") + "</ol></div>";
  } else if (L === "big") {
    h = '<div class="row big"><div class="grow">' + tag + '<div class="num">' + esc(c.num) + '</div><div class="title">' + title + '</div><div class="body">' + body + "</div></div>" + qrBlock(c) + "</div>";
  } else if (L === "wifi") {
    h = '<div class="row wifi"><div class="grow"><div class="tag">Welcome</div><div class="title">Make yourself at home.</div>' +
      '<div class="body">Point your phone\'s camera at the code to join the Wi-Fi.</div><div class="meta">Network: <b>' + esc(c.ssid) + "</b></div></div>" +
      '<div class="qr"><div class="code">' + qrSVG(c.payload) + '</div><div class="cap">Scan to join Wi-Fi</div></div></div>';
  } else if (L === "fact") {
    h = '<div class="fact"><div class="mark">“</div><div><div class="tag">' + esc(c.kicker) + ' <span class="cat">· ' + esc(c.cat) + '</span></div><div class="ftext">' + esc(c.text) + "</div></div></div>";
  } else if (L === "brief") {
    h = '<div class="brief"><div class="tag">' + esc(c.label || nyNow().toLocaleDateString("en-US", { weekday: "long" }) + " briefing") + '</div><div class="hello">' + esc(c.hello) + '</div><div class="items">' +
      c.items.map(function (it) { return '<div class="it">' + icon(it.i) + '<div><div class="k">' + esc(it.k) + '</div><div class="v">' + esc(it.v) + "</div></div></div>"; }).join("") + "</div></div>";
  } else {
    h = '<div class="row"><div class="grow">' + tag + '<div class="title' + long + '">' + title + '</div><div class="body">' + body + '</div><div class="meta">' + esc(c.meta || "") + "</div></div>" + qrBlock(c) + "</div>";
  }
  return h;
}

/* ================== CARD ROTATION ================== */
var deck = [], shown = 0;
function pickCard(p) {   // curated picks get a directions QR
  return Object.assign({ url: mapsUrl(p.title.replace(/^A /, "") + ", " + (p.meta || "").split("·")[0] + ", New York"), qrCap: "Scan for directions" }, p);
}
function buildDeck() {
  var now = nyNow(), m = now.getMonth() + 1, d = now.getDay(), h = now.getHours();
  var today = isoDay(now).slice(0, 10);   // "until": "YYYY-MM-DD" hides a dated pick once its last day has passed
  var picks = shuffle(PICKS.filter(function (p) { return (!p.months || p.months.indexOf(m) > -1) && (!p.days || p.days.indexOf(d) > -1) && (!p.until || today <= p.until); })).map(pickCard);
  // Alternate concerts/shows with city events so neither crowds out the other
  // Editor picks lead; then city events and concerts alternate
  var ev = editorEvents(), es = events.slice(0, 10), ss = shows.slice(0, 6);
  while (es.length || ss.length) { if (es.length) ev.push(es.shift()); if (ss.length) ev.push(ss.shift()); }
  ev = ev.map(function (e) { return e.day ? Object.assign({ layout: "poster" }, e) : e; });
  var urgent = mtaCards().concat(rmCards()), free = freeCards(), big = bigWeather(), brief = briefing(), list = listCard();
  var morning = (h >= 5 && h < 11) || (h >= 17 && h < 23);   // briefing editions: morning and evening
  deck = [];
  if (morning && brief) deck.push(brief);         // mornings open with the briefing
  deck = deck.concat(urgent);                      // then anything that affects you right now
  if (big) deck.push(big);
  var cd = countdownCard();   // anything notable within the next 30 days
  if (cd) deck.push(cd);
  if (editorFresh(editor) && editor.headline && stillOn(editor.headline)) deck.push(editorHeadline());   // the AI editor's pick of the day, early in every cycle
  if (free[0]) deck.push(free[0]);
  if (list) deck.push(list);
  var i = 0;
  while (ev.length || picks.length) {
    if (ev.length) deck.push(ev.shift());
    if (picks.length) deck.push(picks.shift());
    i++;
    if (i === 3 && free[1]) deck.push(free[1]);
    if (i === 4 && morning && brief) deck.push(brief);
    if (i === 5 && list) deck.push(list);
    if (i === 6 && cd) deck.push(cd);
    if (deck.length > 22) break;
  }
}
function nextCard() {
  var body = document.body, card = $("card");
  if (shown > 0 && shown % CFG.ambientEvery === 0 && !body.classList.contains("ambient")) {
    body.classList.add("ambient"); shown++; setTimeout(nextCard, CFG.ambientSeconds * 1000); return;
  }
  body.classList.remove("ambient");
  if (body.classList.contains("night")) { card.classList.add("out"); setTimeout(nextCard, 60000); return; }   // no cards late at night
  if (!deck.length) buildDeck();
  // Every fifth card is a fun fact; on matchday every fourth is the countdown; the rest come from the deck
  var c = body.classList.contains("matchday") && shown % 4 === 1 ? matchdayCard()
        : qs.ws && guestHours() && shown % 12 === 7 ? wifiCard()      // guest Wi-Fi, now and then during visiting hours
        : shown % 5 === 3 ? nextFact() : deck.shift();
  shown++;
  if (!c) { setTimeout(nextCard, 5000); return; }
  card.classList.add("out");
  setTimeout(function () {
    card.className = "out " + (c.cls || "");
    $("cardBody").innerHTML = renderCard(c);
    var secs = c.layout === "brief" || c.layout === "list" ? CFG.cardSeconds + 8 : CFG.cardSeconds;
    // A fresh bar element per card, so the fill always starts from zero (transition resets are unreliable on TV browsers)
    $("progress").innerHTML = '<div id="bar" style="animation-duration:' + (secs - 1.2) + 's"></div>';
    card.classList.remove("out");
    setTimeout(nextCard, secs * 1000);
  }, 1200);
}

/* ================== CLOCK, NIGHT DIMMING, BURN-IN SHIFT ================== */
function tick() {
  var n = nyNow(), h = n.getHours(), m = n.getMinutes();
  $("time").innerHTML = ((h % 12) || 12) + ":" + (m < 10 ? "0" : "") + m + '<span class="ampm">' + (h < 12 ? "AM" : "PM") + "</span>";
  $("date").textContent = n.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  document.body.classList.toggle("night", h >= CFG.nightStart && h < CFG.nightEnd);
  renderRM();
}
function shift() { $("stage").style.transform = "translate(" + Math.round(Math.random() * 16 - 8) + "px," + Math.round(Math.random() * 12 - 6) + "px)"; }

/* ================== START ================== */
tick(); setInterval(tick, 10000);
setInterval(shift, 4 * 6e4);
renderWeather(); loadWeather(); setInterval(loadWeather, 15 * 6e4);
loadMTA(); setInterval(loadMTA, 2 * 6e4);
loadTrains(); setInterval(loadTrains, 30000); setInterval(renderTrains, 15000);
loadEvents(); setInterval(loadEvents, 60 * 6e4);
loadRM(); setInterval(loadRM, 3 * 36e5);
loadOTD(); setInterval(loadOTD, 36e5);
loadEditor(); setInterval(loadEditor, 30 * 6e4);
loadShows(); setInterval(loadShows, 3 * 36e5);
showImage(); setInterval(showImage, CFG.photoSeconds * 1000);
setTimeout(nextCard, 3000);
setInterval(function () { var n = nyNow(); if (n.getHours() === 4 && n.getMinutes() < 2) location.reload(); }, 6e4);
// Self-update: if a new version of the page is published, reload so a long-running screensaver picks it up
var pageVersion = null;
function checkVersion() {
  if (location.protocol !== "https:") return;
  fetch(location.pathname + "?vcheck=" + Date.now(), { method: "HEAD", cache: "no-store" }).then(function (r) {
    var v = r.headers.get("last-modified") || r.headers.get("etag");
    if (!v) return;
    if (pageVersion && v !== pageVersion) location.reload();
    pageVersion = v;
  }).catch(function () {});
}
checkVersion(); setInterval(checkVersion, 10 * 6e4);
</script>
